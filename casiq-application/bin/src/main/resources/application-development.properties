# Development parameters are exposed as casiq.development.* because Quarkus
# normalizes /casiq/development/... SSM names to dotted configuration keys.
quarkus.ssm.config.enabled=true
quarkus.ssm.config.path=/casiq/development/
casiq.security.cookie-secure=false

quarkus.datasource.jdbc.url=${casiq.development.db-url}
quarkus.datasource.username=${casiq.development.db-username}
quarkus.datasource.password=${casiq.development.db-password}
quarkus.flyway.placeholders.initial_admin_company_code=CASIQ
quarkus.flyway.placeholders.initial_admin_username=admin
quarkus.flyway.placeholders.initial_admin_password_hash=$2y$10$3KCq7oEU4eMWvLjis0mmte4waRXof9wtHMcWs6zjsJ7/bXJXD5fEq
casiq.google.client-id=${casiq.development.google-client-id}
casiq.google.client-secret=${casiq.development.google-client-secret}
casiq.google.redirect-uri=${casiq.development.google-redirect-uri}
casiq.microsoft.client-id=${casiq.development.microsoft-client-id}
casiq.microsoft.client-secret=${casiq.development.microsoft-client-secret}
casiq.microsoft.tenant=${casiq.development.microsoft-tenant}
casiq.microsoft.redirect-uri=${casiq.development.microsoft-redirect-uri}
