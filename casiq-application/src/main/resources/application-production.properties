# Production uses separate keys in the same AWS account and region.
quarkus.ssm.config.enabled=true
quarkus.ssm.config.path=/casiq/production/
casiq.security.cookie-secure=true

quarkus.datasource.jdbc.url=${casiq.production.db-url}
quarkus.datasource.username=${casiq.production.db-username}
quarkus.datasource.password=${casiq.production.db-password}
quarkus.flyway.placeholders.initial_admin_company_code=${casiq.production.initial-admin-company-code}
quarkus.flyway.placeholders.initial_admin_username=${casiq.production.initial-admin-username}
quarkus.flyway.placeholders.initial_admin_password_hash=${casiq.production.initial-admin-password-hash}
quarkus.flyway.placeholders.initial_support_refresh_token=${casiq.production.support-refresh-token}
casiq.google.client-id=${casiq.production.google-client-id}
casiq.google.client-secret=${casiq.production.google-client-secret}
casiq.google.redirect-uri=${casiq.production.google-redirect-uri}
casiq.microsoft.client-id=${casiq.production.microsoft-client-id}
casiq.microsoft.client-secret=${casiq.production.microsoft-client-secret}
casiq.microsoft.tenant=${casiq.production.microsoft-tenant}
casiq.microsoft.redirect-uri=${casiq.production.microsoft-redirect-uri}
