quarkus.application.name=casiq
quarkus.http.port=8080
quarkus.http.limits.max-body-size=30M
quarkus.http.static-resources.caching-enabled=false
quarkus.http.static-resources.max-age=0S

# Include the root-level user-management library in this single Quarkus application.
quarkus.index-dependency.user-management.group-id=com.casiq
quarkus.index-dependency.user-management.artifact-id=user-management
quarkus.index-dependency.work-item-management.group-id=com.casiq
quarkus.index-dependency.work-item-management.artifact-id=work-item-management
quarkus.index-dependency.gmail-account-connector.group-id=com.casiq
quarkus.index-dependency.gmail-account-connector.artifact-id=gmail-account-connector
quarkus.index-dependency.microsoft-account-connector.group-id=com.casiq
quarkus.index-dependency.microsoft-account-connector.artifact-id=microsoft-account-connector
quarkus.index-dependency.work-account-core.group-id=com.casiq
quarkus.index-dependency.work-account-core.artifact-id=work-account-core
quarkus.index-dependency.attachment-storage.group-id=com.casiq
quarkus.index-dependency.attachment-storage.artifact-id=attachment-storage

casiq.attachment-storage.provider=local
casiq.attachment-storage.local-root=./data/attachments
casiq.attachment-storage.s3-bucket-prefix=casiq-
casiq.attachment-storage.max-bytes=26214400

# S3 mode uses the AWS default credential provider and region chains.
quarkus.s3.aws.credentials.type=default
quarkus.s3.aws.region=ap-south-1
quarkus.s3.devservices.enabled=false

# SSM uses the AWS default region and credential provider chains. On EC2, grant
# the instance role access to the environment-specific Parameter Store path.
quarkus.ssm.aws.credentials.type=default
quarkus.ssm.aws.region=ap-south-1
quarkus.ssm.devservices.enabled=false
quarkus.ssm.config.recursive=true
quarkus.ssm.config.with-decryption=true
quarkus.ssm.config.update-interval-minutes=0

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/casiq
quarkus.datasource.username=casiq_app
quarkus.datasource.password=password
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.locations=db/migration
quarkus.flyway.placeholders.initial_admin_company_code=CASIQ
quarkus.flyway.placeholders.initial_admin_username=admin
quarkus.flyway.placeholders.initial_admin_password_hash=$2y$10$3KCq7oEU4eMWvLjis0mmte4waRXof9wtHMcWs6zjsJ7/bXJXD5fEq
quarkus.hibernate-orm.schema-management.strategy=validate

casiq.security.cookie-secure=true
casiq.security.session-hours=12
casiq.security.bcrypt-cost=12

quarkus.rest-client.google-oauth.url=https://oauth2.googleapis.com
quarkus.rest-client.google-oauth.connect-timeout=5000
quarkus.rest-client.google-oauth.read-timeout=10000
quarkus.rest-client.gmail-profile.url=https://gmail.googleapis.com
quarkus.rest-client.gmail-profile.connect-timeout=5000
quarkus.rest-client.gmail-profile.read-timeout=10000
quarkus.rest-client.gmail-mailbox.url=https://gmail.googleapis.com
quarkus.rest-client.gmail-mailbox.connect-timeout=5000
quarkus.rest-client.gmail-mailbox.read-timeout=30000

casiq.google.client-id=replace-with-google-client-id
casiq.google.client-secret=replace-with-google-client-secret
casiq.google.redirect-uri=http://localhost:8080/api/v1/gmail/callback
casiq.google.authorization-state-minutes=10

quarkus.rest-client.microsoft-oauth.url=https://login.microsoftonline.com
quarkus.rest-client.microsoft-oauth.connect-timeout=5000
quarkus.rest-client.microsoft-oauth.read-timeout=10000
quarkus.rest-client.microsoft-graph.url=https://graph.microsoft.com
quarkus.rest-client.microsoft-graph.connect-timeout=5000
quarkus.rest-client.microsoft-graph.read-timeout=30000

casiq.microsoft.client-id=replace-with-microsoft-client-id
casiq.microsoft.client-secret=replace-with-microsoft-client-secret
casiq.microsoft.tenant=organizations
casiq.microsoft.redirect-uri=http://localhost:8080/api/v1/microsoft/callback
casiq.microsoft.authorization-state-minutes=10

casiq.email-polling.enabled=true
casiq.email-polling.scheduler-every=30s
casiq.email-polling.batch-size=50
casiq.email-polling.lock-seconds=300
casiq.email-polling.poll-interval-seconds=60
casiq.email-polling.retry-delay-seconds=60
casiq.email-polling.initial-lookback-hours=24
casiq.gmail.polling-page-size=100
casiq.gmail.max-attachment-bytes=26214400
casiq.microsoft.polling-page-size=100
casiq.microsoft.max-attachment-bytes=26214400

casiq.conversation-work-item.enabled=true
casiq.conversation-work-item.scheduler-every=30s
casiq.conversation-work-item.batch-size=50
casiq.conversation-work-item.lock-seconds=300
casiq.conversation-work-item.retry-delay-seconds=60

casiq.work-item-archive.enabled=false
casiq.work-item-archive.scheduler-cron=0 0 2 ? * SUN
casiq.work-item-archive.time-zone=UTC
casiq.work-item-archive.batch-size=100
casiq.work-item-archive.lock-seconds=1800
casiq.work-item-archive.retry-delay-seconds=3600
casiq.work-item-archive.worker-threads=4

casiq.work-item.provider-read-enabled=true
casiq.work-item.email-cache-seconds=300
casiq.conversation-retention.enabled=false
casiq.conversation-retention.scheduler-every=1h
casiq.conversation-retention.hours=4320
casiq.conversation-retention.cache-fallback-hours=24
casiq.conversation-retention.batch-size=500

quarkus.smallrye-openapi.info-title=Casiq API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true

quarkus.log.category."com.casiq".min-level=DEBUG
quarkus.log.category."com.casiq".level=INFO

%test.casiq.google.client-id=test-client.apps.googleusercontent.com
%test.casiq.google.client-secret=test-secret
%test.casiq.google.redirect-uri=http://localhost:8081/api/v1/gmail/callback
%test.casiq.microsoft.client-id=test-microsoft-client-id
%test.casiq.microsoft.client-secret=test-microsoft-client-secret
%test.casiq.microsoft.tenant=organizations
%test.casiq.microsoft.redirect-uri=http://localhost:8081/api/v1/microsoft/callback
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:casiq;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.hibernate-orm.schema-management.strategy=none
%test.quarkus.flyway.placeholders.initial_admin_company_code=TESTROOT
%test.quarkus.flyway.placeholders.initial_admin_username=initial.admin
%test.quarkus.flyway.placeholders.initial_admin_password_hash=$2a$12$s5NWxVxAmmSIUsMLM2e9yepYsbtvKaT1mv0xnkatNfhOGuBNCB9Ra
%test.casiq.security.cookie-secure=false
%test.casiq.security.bcrypt-cost=4
%test.quarkus.scheduler.enabled=false
%test.casiq.email-polling.enabled=false
%test.casiq.conversation-work-item.enabled=false
%test.casiq.work-item-archive.enabled=false
%test.casiq.work-item.provider-read-enabled=false
%test.casiq.conversation-retention.enabled=false
%test.casiq.attachment-storage.provider=local
%test.casiq.attachment-storage.local-root=target/test-attachments
