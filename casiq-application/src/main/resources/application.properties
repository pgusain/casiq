quarkus.application.name=casiq
quarkus.http.port=8080
quarkus.http.limits.max-body-size=64K
quarkus.http.static-resources.caching-enabled=false
quarkus.http.static-resources.max-age=0S

# Include the root-level user-management library in this single Quarkus application.
quarkus.index-dependency.user-management.group-id=com.casiq
quarkus.index-dependency.user-management.artifact-id=user-management
quarkus.index-dependency.work-item-management.group-id=com.casiq
quarkus.index-dependency.work-item-management.artifact-id=work-item-management
quarkus.index-dependency.gmail-account-connector.group-id=com.casiq
quarkus.index-dependency.gmail-account-connector.artifact-id=gmail-account-connector
quarkus.index-dependency.work-account-core.group-id=com.casiq
quarkus.index-dependency.work-account-core.artifact-id=work-account-core

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/zinnia_india
quarkus.datasource.username=zinnia_india
quarkus.datasource.password=
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.locations=db/migration
quarkus.flyway.placeholders.initial_admin_company_code=${INITIAL_ADMIN_COMPANY_CODE}
quarkus.flyway.placeholders.initial_admin_username=${INITIAL_ADMIN_USERNAME}
quarkus.flyway.placeholders.initial_admin_password_hash=${INITIAL_ADMIN_PASSWORD_HASH}
quarkus.hibernate-orm.schema-management.strategy=validate

casiq.security.cookie-secure=${SESSION_COOKIE_SECURE:true}
casiq.security.session-hours=${SESSION_HOURS:12}
casiq.security.bcrypt-cost=12

quarkus.rest-client.google-oauth.url=https://oauth2.googleapis.com
quarkus.rest-client.google-oauth.connect-timeout=5000
quarkus.rest-client.google-oauth.read-timeout=10000
quarkus.rest-client.gmail-profile.url=https://gmail.googleapis.com
quarkus.rest-client.gmail-profile.connect-timeout=5000
quarkus.rest-client.gmail-profile.read-timeout=10000
quarkus.rest-client.gmail-mailbox.url=https://gmail.googleapis.com
quarkus.rest-client.gmail-mailbox.connect-timeout=5000
quarkus.rest-client.gmail-mailbox.read-timeout=30000

casiq.google.client-id=${GOOGLE_CLIENT_ID}
casiq.google.client-secret=${GOOGLE_CLIENT_SECRET}
casiq.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/gmail/callback}
casiq.google.authorization-state-minutes=10

casiq.email-polling.enabled=${EMAIL_POLLING_ENABLED:true}
casiq.email-polling.scheduler-every=${EMAIL_POLLING_SCHEDULER_EVERY:30s}
casiq.email-polling.batch-size=${EMAIL_POLLING_BATCH_SIZE:50}
casiq.email-polling.lock-seconds=${EMAIL_POLLING_LOCK_SECONDS:300}
casiq.email-polling.poll-interval-seconds=${EMAIL_POLLING_INTERVAL_SECONDS:60}
casiq.email-polling.retry-delay-seconds=${EMAIL_POLLING_RETRY_SECONDS:60}
casiq.email-polling.initial-lookback-hours=${EMAIL_POLLING_INITIAL_LOOKBACK_HOURS:24}
casiq.gmail.polling-page-size=${GMAIL_POLLING_PAGE_SIZE:100}

casiq.conversation-work-item.enabled=${CONVERSATION_WORK_ITEM_ENABLED:true}
casiq.conversation-work-item.scheduler-every=${CONVERSATION_WORK_ITEM_SCHEDULER_EVERY:30s}
casiq.conversation-work-item.batch-size=${CONVERSATION_WORK_ITEM_BATCH_SIZE:50}
casiq.conversation-work-item.lock-seconds=${CONVERSATION_WORK_ITEM_LOCK_SECONDS:300}
casiq.conversation-work-item.retry-delay-seconds=${CONVERSATION_WORK_ITEM_RETRY_SECONDS:60}

quarkus.smallrye-openapi.info-title=Casiq API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true

quarkus.log.category."com.casiq".min-level=DEBUG
quarkus.log.category."com.casiq".level=${CASIQ_LOG_LEVEL:INFO}

%test.casiq.google.client-id=test-client.apps.googleusercontent.com
%test.casiq.google.client-secret=test-secret
%test.casiq.google.redirect-uri=http://localhost:8081/api/v1/gmail/callback
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:casiq;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.hibernate-orm.schema-management.strategy=none
%test.quarkus.flyway.placeholders.initial_admin_company_code=TESTROOT
%test.quarkus.flyway.placeholders.initial_admin_username=initial.admin
%test.quarkus.flyway.placeholders.initial_admin_password_hash=$2a$12$s5NWxVxAmmSIUsMLM2e9yepYsbtvKaT1mv0xnkatNfhOGuBNCB9Ra
%test.casiq.security.cookie-secure=false
%test.casiq.security.bcrypt-cost=4
%test.quarkus.scheduler.enabled=false
%test.casiq.email-polling.enabled=false
%test.casiq.conversation-work-item.enabled=false
