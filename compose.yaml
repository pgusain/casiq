services:
  postgres:
    image: postgres:16
    container_name: casiq-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: casiq
      POSTGRES_USER: casiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casiq -d casiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  casiq:
    image: ${IMAGE_REF:?IMAGE_REF is required}
    container_name: casiq-app
    restart: unless-stopped

    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"

    environment:
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/casiq
      QUARKUS_DATASOURCE_USERNAME: casiq
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - "${ATTACHMENT_DATA_DIR:-/opt/casiq/data/attachments}:/work/data/attachments"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
