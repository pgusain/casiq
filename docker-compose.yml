version: "3.8"

services:
  casiq-db:
    image: postgres:15
    environment:
      POSTGRES_DB: casiq
      POSTGRES_USER: casiq_app
      POSTGRES_PASSWORD: changeme
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casiq_app -d casiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  casiq-app:
    build: .
    image: casiq-app:local
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://casiq-db:5432/casiq"
      QUARKUS_DATASOURCE_USERNAME: "casiq_app"
      QUARKUS_DATASOURCE_PASSWORD: "changeme"
    volumes:
      - ./data/attachments:/work/data/attachments
      - ./logs:/opt/casiq/logs:rw
      - ./config:/opt/casiq/config:ro
    depends_on:
      - casiq-db

